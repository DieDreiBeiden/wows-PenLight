# Release von Hand ausloesen: Actions -> Release -> Run workflow (auf main).
# Version = version in mod/res_mods/ForgeBlueprints/PenLightContainer.xml (main und main-standalone
# muessen uebereinstimmen). Prueft beide Fassungen (Tests, Main.py aktuell), baut die Zips direkt aus
# main und main-standalone und legt Tag v<Version> auf dem main-Commit samt Release an.
# Release-Text: Vorlage docs/RELEASE_NOTES.md, "What's new" = Abschnitt "Unreleased" aus
# docs/CHANGELOG.md, dazu Vergleichslink zum vorherigen Release. Danach wird "Unreleased" im
# Changelog zur neuen Version und als Commit auf main geschoben.
name: Release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Als Vorabversion markieren'
        type: boolean
        default: true
      replace:
        description: 'Bestehenden Release und Tag dieser Version loeschen und neu anlegen'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PRERELEASE: ${{ inputs.prerelease }}
      REPLACE: ${{ inputs.replace }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Version und Release-Text pruefen
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Release nur von main ausloesen (aktuell $GITHUB_REF)"
            exit 1
          fi
          git worktree add ../standalone origin/main-standalone
          manifest=mod/res_mods/ForgeBlueprints/PenLightContainer.xml
          VERSION=$(python3 -I tools/release_notes.py version "$manifest")
          STANDALONE=$(python3 -I tools/release_notes.py version "../standalone/$manifest")
          if [ "$VERSION" != "$STANDALONE" ]; then
            echo "::error::Version main $VERSION, main-standalone $STANDALONE"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null && [ "$REPLACE" != "true" ]; then
            echo "::error::Tag v$VERSION existiert bereits (Version im Manifest erhoehen oder 'replace' waehlen)"
            exit 1
          fi
          PREVIOUS=$(git tag -l 'v[0-9]*' --sort=-v:refname | grep -vx "v$VERSION" | head -1 || true)
          mkdir dist
          python3 -I tools/release_notes.py notes "$VERSION" "$PREVIOUS" "$GITHUB_REPOSITORY" > dist/notes.md
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Version $VERSION, vorheriger Release ${PREVIOUS:-keiner}"
          cat dist/notes.md

      - name: Tests und Main.py (main)
        run: |
          python3 -m unittest discover -s tests
          python3 -I tools/build_mod.py
          git diff --exit-code -- mod/res_mods/PnFMods/PenLight/Main.py

      - name: Tests und Main.py (main-standalone)
        run: |
          cd ../standalone
          python3 -m unittest discover -s tests
          python3 -I tools/build_mod.py
          git diff --exit-code -- mod/res_mods/PnFMods/PenLight/Main.py

      - name: Pakete bauen
        run: |
          git archive --format=zip -o "dist/PenLight-$VERSION-ttaro.zip" HEAD:mod res_mods
          git archive --format=zip -o "dist/PenLight-$VERSION-standalone.zip" origin/main-standalone:mod res_mods
          for z in dist/*.zip; do unzip -l "$z" | tail -1; done

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$REPLACE" = "true" ]; then
            gh release delete "v$VERSION" --cleanup-tag --yes || true
            git push origin ":refs/tags/v$VERSION" || true
          fi
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "v$VERSION" dist/*.zip \
            --target "$GITHUB_SHA" \
            --title "PenLight $VERSION" \
            --notes-file dist/notes.md \
            "${flags[@]}"

      - name: Changelog fortschreiben
        run: |
          python3 -I tools/release_notes.py finalize "$VERSION" "$(date -u +%F)"
          if git diff --quiet -- docs/CHANGELOG.md; then
            echo "Changelog bereits auf $VERSION"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898297+github-actions[bot]@users.noreply.github.com'
          git commit -m "CHANGELOG: $VERSION" -- docs/CHANGELOG.md
          git push origin HEAD:main || echo "::warning::Changelog-Commit nicht gepusht (main hat sich bewegt); 'Unreleased' von Hand nach $VERSION verschieben"
